spring.application.name=microservice-patient

logging.level.org.springframework=INFO

server.port=8100

################### DataSource Configuration ##########################
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://host.docker.internal:3306/microservices
spring.datasource.username=microservice
spring.datasource.password=microservicepassword

################### Hibernate Configuration ##########################

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

################### Eureka Configuration ##########################
eureka.client.serviceUrl.defaultZone: http://eureka-server:9102/eureka/