spring.application.name=microservice-gateway
server.port=8080
spring.main.web-application-type=reactive
#logging.level.org.springframework=DEBUG

logging.level.org.springframework.cloud.gateway=DEBUG
#logging.level.reactor.netty.http.server=DEBUG
#logging.level.org.springframework.security=DEBUG
#logging.level.org.springframework.security.core.userdetails=DEBUG

################### Eureka Configuration ##########################
eureka.client.serviceUrl.defaultZone: http://eureka-server:9102/eureka/

################### Security Configuration ##########################
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.timeout=1m
server.reactive.session.timeout=1m

# Route pour le service "clientUI"
spring.cloud.gateway.routes[0].id=ClientUI
spring.cloud.gateway.routes[0].uri=http://microservice-clientui:8110
spring.cloud.gateway.routes[0].predicates[0]=Path=/

# Route pour le service "clientUI"
spring.cloud.gateway.routes[1].id=ClientUI
spring.cloud.gateway.routes[1].uri=http://microservice-clientui:8110
spring.cloud.gateway.routes[1].predicates[0]=Path=/details-patient/**

# Route pour le service "patient"
spring.cloud.gateway.routes[2].id=MicroservicePatient
spring.cloud.gateway.routes[2].uri=http://microservice-patient:8100
spring.cloud.gateway.routes[2].predicates[0]=Path=/Patients/**

# Route pour le service "NotesPatient"
spring.cloud.gateway.routes[3].id=MicroserviceNotesPatient
spring.cloud.gateway.routes[3].uri=http://microservice-notes:8111
spring.cloud.gateway.routes[3].predicates[0]=Path=/NotesPatients/**

# Route pour le service "clientUI"
spring.cloud.gateway.routes[4].id=ClientUI
spring.cloud.gateway.routes[4].uri=http://microservice-clientui:8110
spring.cloud.gateway.routes[4].predicates[0]=Path=/notes-patient/**

# Route pour le service "DiabetAssessment"
spring.cloud.gateway.routes[5].id=MicroServiceDiabetAssessment
spring.cloud.gateway.routes[5].uri=http://microservice-diabet-assessment:8112
spring.cloud.gateway.routes[5].predicates[0]=Path=/RapportDiabete/**